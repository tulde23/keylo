# Builds Keylo for Windows and Linux when a version tag (vX.Y.Z) is pushed, and creates a DRAFT
# GitHub release with those files and SHA256SUMS.txt. macOS is built, signed and notarized on the
# Mac (./build.sh --release; the Developer ID key stays there): upload its zip, update the sums
# and publish the draft by hand.
# Run it from the Actions tab (workflow_dispatch) to build and test without making a release.
# The C# Keylo it builds lives in rust_csharp/ (the Rust port is at the root).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust_csharp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Directory.Build.props says $version, the tag is ${{ github.ref_name }}" }

      - name: Test
        run: dotnet test tests/Keylo.Core.Tests -c Release --nologo

      - name: Build
        shell: pwsh
        run: |
          ./build.ps1
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist/Keylo, install.ps1 -DestinationPath "out/keylo-$version-windows-x64.zip"
          & ./dist/Keylo/keylo.exe version

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: rust_csharp/out/*.zip
          if-no-files-found: error

  linux:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust_csharp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: ./build-linux.sh --arch ${{ matrix.arch }}

      - name: Smoke test (encrypted vault)
        run: tests/linux-smoke.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: rust_csharp/dist/keylo-*-linux-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: sha256sum keylo-* | tee SHA256SUMS.txt

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/* --draft --title "Keylo ${TAG#v}" \
              --notes "Windows and Linux builds. Add the macOS zip (./build.sh --release on the Mac), update SHA256SUMS.txt, then publish." \
              -R "$GITHUB_REPOSITORY"
          fi

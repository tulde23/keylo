# Builds, tests and publishes Keylo (the Rust port) on every merge to main that changes shipped code
# (see the paths below): Windows, Linux (x64 and
# ARM64) and macOS (Apple silicon, Developer ID signed and notarized). When every build passes, the files are published as
# the latest GitHub release, tagged v<major>.<minor>.<run number> (major.minor from Cargo.toml; every
# build is stamped with that version, so the app can tell which release is newer).
#
# Updates: latest.json lists the newest version with a download and a minisign signature per
# platform (the Windows zip, the macOS .app.tar.gz), signed with the TAURI_SIGNING_PRIVATE_KEY
# secret. The app checks it and verifies the signature against the public key in tauri.conf.json.
#
# Release files:
#   keylo-<v>-windows-x64.zip        keylow.exe (app), keylo.exe (command), install.ps1
#   Keylo_<v>_x64-setup.exe          the app's installer (keylo.exe installed next to it)
#   keylo-<v>-linux-<arch>.tar.gz    keylow, keylo, install.sh, the polkit policy
#   Keylo_<v>_<arch>.deb             the same as a Debian/Ubuntu package
#   keylo-<v>-macos-arm64.zip        Keylo.app with keylo and keylo-mac inside, signed with the
#                                    Developer ID and notarized (the ticket is stapled)
#   keylo-<v>-macos-arm64.app.tar.gz the same Keylo.app, for the in-app updater
#   *.sig, latest.json               update signatures and the update manifest
#
# macOS signing secrets (the release fails without them: an ad-hoc signed build would make the
# Keychain ask again for every secret after an update, since only a Developer ID signature stays
# the same from one build to the next):
#   APPLE_CERTIFICATE           the "Developer ID Application" certificate and key, a base64 .p12
#   APPLE_CERTIFICATE_PASSWORD  its password
#   APPLE_API_KEY               an App Store Connect API key (the .p8 file's text), for notarizing
#   APPLE_API_KEY_ID            its key id
#   APPLE_API_ISSUER            its issuer id
name: release

on:
  push:
    branches: [main]
    # Only when something that's built and shipped changes: docs, tests and
    # workflow-only edits don't build or publish a release.
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build-version.rs'
      - 'crates/**'
      - 'app/index.html'
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'app/tsconfig.json'
      - 'app/vite.config.ts'
      - 'app/public/**'
      - 'app/src/**'
      - 'app/src-tauri/**'
      - 'packaging/**'
      # Package-manager manifests aren't part of a release (packages.yml publishes them).
      - '!packaging/chocolatey/**'
      - '!packaging/winget/**'
      - '!packaging/homebrew/**'
  # By hand (Actions → release → Run workflow, or gh workflow run release): e.g. after a change
  # to this workflow or to the release secrets.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Version
        run: bash .github/stamp-version.sh

      - name: Unit tests
        run: cargo test -p keylo-core -p keylo-cli

      - name: Build keylo
        run: |
          cargo build --release -p keylo-cli
          ./target/release/keylo.exe version

      - name: Build the app
        run: |
          mkdir -p app/src-tauri/binaries
          cp target/release/keylo.exe app/src-tauri/binaries/keylo-x86_64-pc-windows-msvc.exe
          cd app && npm ci && npx tauri build --bundles nsis --config "$GITHUB_WORKSPACE/app/src-tauri/release/windows.json"

      - name: Package
        shell: pwsh
        run: |
          $stage = "out/keylo-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/keylow.exe, target/release/keylo.exe, packaging/windows/install.ps1 $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "out/keylo-$env:VERSION-windows-x64.zip"
          Copy-Item target/release/bundle/nsis/*-setup.exe out/

      - name: Sign the update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd app && npx tauri signer sign "$GITHUB_WORKSPACE/out/keylo-$VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            out/*.zip
            out/*.sig
            out/*-setup.exe
          if-no-files-found: error

  linux:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf gnome-keyring dbus

      - name: Version
        run: bash .github/stamp-version.sh

      - name: Unit tests
        run: cargo test -p keylo-core -p keylo-platform -p keylo-cli

      - name: Build keylo
        run: cargo build --release -p keylo-cli

      - name: Store checks (encrypted vault and desktop keyring)
        run: KEYLO_BIN=$PWD/target/release/keylo bash tests/linux-compat.sh

      - name: Build the app
        run: |
          mkdir -p app/src-tauri/binaries
          cp target/release/keylo "app/src-tauri/binaries/keylo-$(rustc -vV | sed -n 's/host: //p')"
          cd app && npm ci && npx tauri build --bundles deb --config "$GITHUB_WORKSPACE/app/src-tauri/release/linux.json"

      - name: Package
        run: |
          name=keylo-$VERSION-linux-${{ matrix.arch }}
          mkdir -p "out/$name"
          cp target/release/keylow target/release/keylo packaging/linux/install.sh packaging/linux/io.github.tulde23.keylo.policy "out/$name/"
          cp app/src-tauri/icons/128x128@2x.png "out/$name/keylo.png"
          chmod +x "out/$name/install.sh"
          tar -czf "out/$name.tar.gz" -C out "$name"
          cp target/release/bundle/deb/*.deb out/

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            out/*.tar.gz
            out/*.deb
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Version
        run: bash .github/stamp-version.sh

      - name: Unit tests
        run: cargo test -p keylo-core -p keylo-platform -p keylo-cli

      - name: Build keylo and keylo-mac
        run: |
          cargo build --release -p keylo-cli
          swiftc -O packaging/macos/keylo-mac.swift -o target/release/keylo-mac

      - name: Keychain checks (a throwaway keychain)
        run: bash tests/macos-ci.sh target/release/keylo

      - name: Build the app
        run: |
          triple=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p app/src-tauri/binaries
          cp target/release/keylo "app/src-tauri/binaries/keylo-$triple"
          cp target/release/keylo-mac "app/src-tauri/binaries/keylo-mac-$triple"
          cd app && npm ci && npx tauri build --bundles app --config "$GITHUB_WORKSPACE/app/src-tauri/release/macos.json"

      # A throwaway keychain for this run, holding only the Developer ID identity.
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::error::APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD are required (see the top of this file)"
            exit 1
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw=$(openssl rand -hex 24)
          p12="$RUNNER_TEMP/devid.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "::error::APPLE_CERTIFICATE has no Developer ID Application identity"
            exit 1
          fi
          echo "Signing as $identity"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      # Hardened runtime and a secure timestamp; the two helpers first, then the bundle (which signs
      # keylow, its main program). Fixed identifiers keep each program's identity, and with it the
      # Keychain's "Always Allow", the same across updates.
      - name: Sign and notarize
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "::error::APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER are required (see the top of this file)"
            exit 1
          fi
          app=target/release/bundle/macos/Keylo.app
          sign() { codesign --force --timestamp --options runtime --keychain "$SIGN_KEYCHAIN" --sign "$SIGN_IDENTITY" "$@"; }
          sign --identifier io.github.tulde23.keylo.cli "$app/Contents/MacOS/keylo"
          # keylo-mac needs the keychain-access-group entitlement for the Touch ID (biometric) unlock key.
          sign --identifier io.github.tulde23.keylo.helper --entitlements packaging/macos/keylo-mac.entitlements "$app/Contents/MacOS/keylo-mac"
          sign "$app"
          codesign --verify --strict --deep --verbose=2 "$app"

          key="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$APPLE_API_KEY" > "$key"
          zip="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent "$app" "$zip"
          result="$RUNNER_TEMP/notary.json"
          xcrun notarytool submit "$zip" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 45m --output-format json > "$result" || true
          status=$(jq -r '.status // empty' "$result")
          if [ "$status" != "Accepted" ]; then
            cat "$result"
            id=$(jq -r '.id // empty' "$result")
            [ -n "$id" ] && xcrun notarytool log "$id" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
            rm -f "$key"
            echo "::error::Notarization failed (status: ${status:-none})"
            exit 1
          fi
          rm -f "$key" "$zip"
          xcrun stapler staple "$app"
          spctl --assess --type exec --verbose=2 "$app"

      - name: Package
        run: |
          app=target/release/bundle/macos/Keylo.app
          mkdir -p out
          ditto -c -k --keepParent "$app" "out/keylo-$VERSION-macos-arm64.zip"
          # For the updater: Keylo.app at the archive's root, no AppleDouble files.
          COPYFILE_DISABLE=1 tar -czf "out/keylo-$VERSION-macos-arm64.app.tar.gz" -C "$(dirname "$app")" Keylo.app

      - name: Sign the update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd app && npx tauri signer sign "$GITHUB_WORKSPACE/out/keylo-$VERSION-macos-arm64.app.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            out/*.zip
            out/*.tar.gz
            out/*.sig
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always()
        run: '[ -z "$SIGN_KEYCHAIN" ] || security delete-keychain "$SIGN_KEYCHAIN" || true'

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Version
        id: version
        run: |
          bash .github/stamp-version.sh
          # The stamped version, for the packages job.
          grep '^VERSION=' "$GITHUB_ENV" | tail -1 | sed 's/^VERSION=/version=/' >> "$GITHUB_OUTPUT"

      - name: Update manifest
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          win="keylo-$VERSION-windows-x64.zip"
          mac="keylo-$VERSION-macos-arm64.app.tar.gz"
          jq -n --arg v "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "Built from ${GITHUB_SHA::7}." \
            --arg wurl "$base/$win" --rawfile wsig "out/$win.sig" \
            --arg murl "$base/$mac" --rawfile msig "out/$mac.sig" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
               "windows-x86_64": {url: $wurl, signature: ($wsig | rtrimstr("\n"))},
               "darwin-aarch64": {url: $murl, signature: ($msig | rtrimstr("\n"))}}}' > out/latest.json
          cat out/latest.json

      - name: Checksums
        working-directory: out
        run: sha256sum * | tee SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$VERSION
          tag="v$version"
          gh release create "$tag" out/* \
            --target "$GITHUB_SHA" \
            --title "Keylo $version" \
            --latest \
            --notes "Built from $GITHUB_SHA on merge to main.

          - Windows: the setup .exe (adds keylo to your PATH), or keylo-$version-windows-x64.zip (run install.ps1). Also on winget (tulde23.Keylo) and Chocolatey (keylo). Either updates itself from the app.
          - Linux: the .deb, or the tarball (run install.sh; the app needs libwebkit2gtk-4.1-0).
          - macOS (Apple silicon): signed with a Developer ID and notarized; unzip and move Keylo.app to Applications. It updates itself from the app.

          Check downloads against SHA256SUMS.txt."

  # Chocolatey and winget (see packages.yml). A failure here doesn't undo the release.
  packages:
    needs: release
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

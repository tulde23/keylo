# Builds, tests and publishes Keylo (the Rust port) on every merge to main that changes shipped code
# (see the paths below): Windows, Linux (x64 and
# ARM64) and macOS (Apple silicon, unsigned). When every build passes, the files are published as
# the latest GitHub release, tagged v<major>.<minor>.<run number> (major.minor from Cargo.toml; every
# build is stamped with that version, so the app can tell which release is newer).
#
# Updates: latest.json lists the newest version with a download and a minisign signature per
# platform (the Windows zip, the macOS .app.tar.gz), signed with the TAURI_SIGNING_PRIVATE_KEY
# secret. The app checks it and verifies the signature against the public key in tauri.conf.json.
#
# Release files:
#   keylo-<v>-windows-x64.zip        keylow.exe (app), keylo.exe (command), install.ps1
#   Keylo_<v>_x64-setup.exe          the app's installer (keylo.exe installed next to it)
#   keylo-<v>-linux-<arch>.tar.gz    keylow, keylo, install.sh, the polkit policy
#   Keylo_<v>_<arch>.deb             the same as a Debian/Ubuntu package
#   keylo-<v>-macos-arm64.zip        Keylo.app with keylo and keylo-mac inside (ad-hoc signed, not
#                                    notarized: open it with right-click → Open the first time)
#   keylo-<v>-macos-arm64.app.tar.gz the same Keylo.app, for the in-app updater
#   keylo-<v>-browser-chrome.zip     the browser extension (Chrome, Edge, Brave: load unpacked)
#   keylo-<v>-browser-firefox.zip    the same for Firefox
#   *.sig, latest.json               update signatures and the update manifest
name: release

on:
  push:
    branches: [main]
    # Only when something that's built and shipped changes: docs, tests, the C# code and
    # workflow-only edits don't build or publish a release.
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build-version.rs'
      - 'crates/**'
      - 'app/index.html'
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'app/tsconfig.json'
      - 'app/vite.config.ts'
      - 'app/public/**'
      - 'app/src/**'
      - 'app/src-tauri/**'
      - 'packaging/**'
      - 'browser/**'
      - 'rust_csharp/src/Keylo.Platform.MacOS/helper/**'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Version
        run: bash .github/stamp-version.sh

      - name: Unit tests
        run: cargo test -p keylo-core -p keylo-cli

      - name: Build keylo
        run: |
          cargo build --release -p keylo-cli
          ./target/release/keylo.exe version

      - name: Build the app
        run: |
          mkdir -p app/src-tauri/binaries
          cp target/release/keylo.exe app/src-tauri/binaries/keylo-x86_64-pc-windows-msvc.exe
          cd app && npm ci && npx tauri build --bundles nsis --config "$GITHUB_WORKSPACE/app/src-tauri/release/windows.json"

      - name: Package
        shell: pwsh
        run: |
          $stage = "out/keylo-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/keylow.exe, target/release/keylo.exe, packaging/windows/install.ps1 $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "out/keylo-$env:VERSION-windows-x64.zip"
          Copy-Item target/release/bundle/nsis/*-setup.exe out/

      - name: Sign the update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd app && npx tauri signer sign "$GITHUB_WORKSPACE/out/keylo-$VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            out/*.zip
            out/*.sig
            out/*-setup.exe
          if-no-files-found: error

  linux:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf gnome-keyring dbus

      - name: Version
        run: bash .github/stamp-version.sh

      - name: Unit tests
        run: cargo test -p keylo-core -p keylo-platform -p keylo-cli

      - name: Build keylo
        run: cargo build --release -p keylo-cli

      - name: Store checks (encrypted vault and desktop keyring)
        run: KEYLO_BIN=$PWD/target/release/keylo bash tests/linux-compat.sh

      - name: Build the app
        run: |
          mkdir -p app/src-tauri/binaries
          cp target/release/keylo "app/src-tauri/binaries/keylo-$(rustc -vV | sed -n 's/host: //p')"
          cd app && npm ci && npx tauri build --bundles deb --config "$GITHUB_WORKSPACE/app/src-tauri/release/linux.json"

      - name: Package
        run: |
          name=keylo-$VERSION-linux-${{ matrix.arch }}
          mkdir -p "out/$name"
          cp target/release/keylow target/release/keylo packaging/linux/install.sh packaging/linux/io.github.tulde23.keylo.policy "out/$name/"
          cp app/src-tauri/icons/128x128@2x.png "out/$name/keylo.png"
          chmod +x "out/$name/install.sh"
          tar -czf "out/$name.tar.gz" -C out "$name"
          cp target/release/bundle/deb/*.deb out/

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            out/*.tar.gz
            out/*.deb
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Version
        run: bash .github/stamp-version.sh

      - name: Unit tests
        run: cargo test -p keylo-core -p keylo-platform -p keylo-cli

      - name: Build keylo and keylo-mac
        run: |
          cargo build --release -p keylo-cli
          swiftc -O rust_csharp/src/Keylo.Platform.MacOS/helper/keylo-mac.swift -o target/release/keylo-mac

      - name: Keychain checks (a throwaway keychain)
        run: bash tests/macos-ci.sh target/release/keylo

      - name: Build the app
        run: |
          triple=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p app/src-tauri/binaries
          cp target/release/keylo "app/src-tauri/binaries/keylo-$triple"
          cp target/release/keylo-mac "app/src-tauri/binaries/keylo-mac-$triple"
          cd app && npm ci && npx tauri build --bundles app --config "$GITHUB_WORKSPACE/app/src-tauri/release/macos.json"

      - name: Package (ad-hoc signed)
        run: |
          app=target/release/bundle/macos/Keylo.app
          codesign --force --deep --sign - "$app"
          mkdir -p out
          ditto -c -k --keepParent "$app" "out/keylo-$VERSION-macos-arm64.zip"
          # For the updater: Keylo.app at the archive's root, no AppleDouble files.
          COPYFILE_DISABLE=1 tar -czf "out/keylo-$VERSION-macos-arm64.app.tar.gz" -C "$(dirname "$app")" Keylo.app

      - name: Sign the update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd app && npx tauri signer sign "$GITHUB_WORKSPACE/out/keylo-$VERSION-macos-arm64.app.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            out/*.zip
            out/*.tar.gz
            out/*.sig
          if-no-files-found: error

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Version
        run: bash .github/stamp-version.sh

      - name: Browser extension
        run: bash browser/package.sh "$VERSION" out

      - name: Update manifest
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          win="keylo-$VERSION-windows-x64.zip"
          mac="keylo-$VERSION-macos-arm64.app.tar.gz"
          jq -n --arg v "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "Built from ${GITHUB_SHA::7}." \
            --arg wurl "$base/$win" --rawfile wsig "out/$win.sig" \
            --arg murl "$base/$mac" --rawfile msig "out/$mac.sig" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
               "windows-x86_64": {url: $wurl, signature: ($wsig | rtrimstr("\n"))},
               "darwin-aarch64": {url: $murl, signature: ($msig | rtrimstr("\n"))}}}' > out/latest.json
          cat out/latest.json

      - name: Checksums
        working-directory: out
        run: sha256sum * | tee SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$VERSION
          tag="v$version"
          gh release create "$tag" out/* \
            --target "$GITHUB_SHA" \
            --title "Keylo $version" \
            --latest \
            --notes "Built from $GITHUB_SHA on merge to main.

          - Windows: keylo-$version-windows-x64.zip (run install.ps1) or the setup .exe. Either updates itself from the app.
          - Linux: the .deb, or the tarball (run install.sh; the app needs libwebkit2gtk-4.1-0).
          - macOS (Apple silicon): unsigned; unzip, move Keylo.app to Applications, and right-click → Open the first time. It updates itself from the app.
          - Browser extension: keylo-$version-browser-chrome.zip (Chrome, Edge, Brave) or -firefox.zip; see Settings → Browser in Keylo.

          Check downloads against SHA256SUMS.txt."

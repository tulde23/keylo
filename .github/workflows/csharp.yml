# Builds and tests the C# Keylo (rust_csharp/) for Windows and Linux, by hand from the Actions tab.
# It no longer publishes releases: merges to main publish the Rust port (release.yml). The build
# files are kept as workflow artifacts.
name: csharp

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust_csharp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Directory.Build.props says $version, the tag is ${{ github.ref_name }}" }

      - name: Test
        run: dotnet test tests/Keylo.Core.Tests -c Release --nologo

      - name: Build
        shell: pwsh
        run: |
          ./build.ps1
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist/Keylo, install.ps1 -DestinationPath "out/keylo-$version-windows-x64.zip"
          & ./dist/Keylo/keylo.exe version

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: rust_csharp/out/*.zip
          if-no-files-found: error

  linux:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust_csharp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: ./build-linux.sh --arch ${{ matrix.arch }}

      - name: Smoke test (encrypted vault)
        run: tests/linux-smoke.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: rust_csharp/dist/keylo-*-linux-*.tar.gz
          if-no-files-found: error

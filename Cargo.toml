[workspace]
resolver = "2"
members = ["crates/keylo-core", "crates/keylo-platform", "crates/keylo-cli", "app/src-tauri"]

[workspace.package]
version = "1.7.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
zeroize = "1"
dirs = "6"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
flate2 = "1"
keylo-core = { path = "crates/keylo-core" }
keylo-platform = { path = "crates/keylo-platform" }

[profile.release]
lto = true
codegen-units = 1
strip = true
